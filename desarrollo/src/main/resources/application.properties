spring.application.name=desarrollo
server.port=8081

# Carga el .env (funciona tanto si ejecutas desde MuvU como desde MuvU/desarrollo)
spring.config.import=optional:file:.env[.properties],optional:file:desarrollo/.env[.properties]

# ===== Base de datos (Docker, puerto 5433) =====
spring.datasource.url=jdbc:postgresql://localhost:5433/Muvu
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===== APIs externas =====
stripe.api.key=${STRIPE_SECRET_KEY}
google.maps.api.key=${GOOGLE_MAPS_API_KEY}

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===== CORS (orígenes separados por coma) =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===== Correo (Gmail) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Logs (SLF4J + Logback) =====
logging.level.root=INFO
logging.level.com.example.desarrollo=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
