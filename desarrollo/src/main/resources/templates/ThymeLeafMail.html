<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">MuvU</title>
</head>
<body style="margin:0; padding:0; background-color:#f1f5f9; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

<!-- Preheader: texto que Gmail muestra como vista previa en la bandeja -->
<div style="display:none; max-height:0; overflow:hidden; opacity:0;" th:text="${body}"></div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f9;">
    <tr>
        <td align="center" style="padding:32px 16px;">

            <!-- Tarjeta principal -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:600px; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 4px 24px rgba(15,23,42,0.08);">

                <!-- Encabezado -->
                <tr>
                    <td align="center" bgcolor="#2563eb"
                        style="background-color:#2563eb; background-image:linear-gradient(135deg,#2563eb 0%,#7c3aed 100%); padding:40px 32px;">
                        <div style="font-size:34px; font-weight:800; color:#ffffff; letter-spacing:-0.5px;">🏠 MuvU</div>
                        <div style="font-size:14px; color:#dbeafe; margin-top:8px;">Tu habitación ideal, cerca de tu universidad</div>
                    </td>
                </tr>

                <!-- Contenido -->
                <tr>
                    <td style="padding:40px 40px 8px 40px;">
                        <h1 style="margin:0 0 16px 0; font-size:24px; line-height:32px; color:#0f172a; font-weight:700;"
                            th:text="${title}">Título del correo</h1>
                        <p style="margin:0; font-size:16px; line-height:26px; color:#475569;"
                           th:text="${body}">Mensaje del correo</p>
                    </td>
                </tr>

                <!-- Botón -->
                <tr>
                    <td align="center" style="padding:32px 40px 16px 40px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td align="center" bgcolor="#2563eb" style="border-radius:10px;">
                                    <a th:href="${actionUrl != null ? actionUrl : frontendUrl}" href="#" target="_blank"
                                       style="display:inline-block; padding:14px 36px; font-size:16px; font-weight:600; color:#ffffff; text-decoration:none; border-radius:10px;"
                                       th:text="${actionText != null ? actionText : 'Ir a MuvU →'}">Ir a MuvU →</a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Enlace de respaldo (solo si hay acción) -->
                <tr th:if="${actionUrl != null}">
                    <td style="padding:0 40px 32px 40px;">
                        <p style="margin:0; font-size:12px; line-height:18px; color:#94a3b8; text-align:center;">
                            Si el botón no funciona, copia este enlace en tu navegador:<br>
                            <a th:href="${actionUrl}" th:text="${actionUrl}" style="color:#2563eb; word-break:break-all;">enlace</a>
                        </p>
                    </td>
                </tr>

                <!-- Pie -->
                <tr>
                    <td align="center" bgcolor="#f8fafc"
                        style="background-color:#f8fafc; padding:24px 32px; border-top:1px solid #e2e8f0;">
                        <p style="margin:0 0 6px 0; font-size:12px; line-height:18px; color:#94a3b8;">
                            Este es un correo automático, por favor no respondas a este mensaje.
                        </p>
                        <p style="margin:0; font-size:12px; line-height:18px; color:#94a3b8;">
                            © <span th:text="${year}">2026</span> MuvU · Lima, Perú
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
